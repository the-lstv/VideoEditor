    <!-- Important immediate styles (to avoid flicker & render loading as soon as possible) -->
    <style>
        :root, body {
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: var(--surface-n2, #1e1e1e) !important;
            user-select: none;
        }

        /* Splash screen */
        #logo {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(calc(-50% + 92px), calc(-50% + 10px));
            offset-path: path('M8.24713 23.3995C8.24713 23.3995 42.001 -13.0019 104.001 40.9985C166.001 94.9989 238 404 238 404');
            offset-distance: 0%;
            offset-rotate: 0deg;
            /* Above everything */
            /* z-index: 90000000005; */
            z-index: 49000000000000;
            pointer-events: none;
        }

        #app-loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5rem;
            color: var(--ls-text-secondary);
        }

        /* Loader */
        .loader {
            width: 50px;
            aspect-ratio: 1;
            border-radius: 50%;
            border: 8px solid;
            border-color: currentColor #0000;
            animation: l1 1s infinite;
        }

        @keyframes l1 { to { transform: rotate(.5turn) } }
    </style>

    </div>

    <!-- Main Editor Container -->
    <main id="editor-container" style='display: none'>
        <!-- Editor Header -->
        <!-- TODO: to be refactored to ToolbarComponents -->
        <nav id="editor-header" class="level-2">

            <!-- Navigation Items -->
            <div>

                <div tabindex='0' class="nav-menu-item" data-ls-i18n="nav.help" data-ls-i18n-fallback="Help">Help</div>
            </div>

            <div class="header-center">
                <div tabindex='0' class="nav-menu-item">Flavor: <span id="flavor-name">Default</span></div>
                <div tabindex='0' class="nav-menu-item">Project: <span id="project-name">Untitled</span></div>
            </div>

            <!-- Undo/Redo Buttons -->
            <div>
                <div tabindex='0' id="undoButton" ls-tooltip='Undo' class="disabled nav-menu-item">
                    <svg xmlns='http://www.w3.org/2000/svg' width='1em' height='1em' fill='currentColor' viewBox='0 0 256 256'><path d='M236,144a68.07,68.07,0,0,1-68,68H80a12,12,0,0,1,0-24h88a44,44,0,0,0,0-88H61l27.52,27.51a12,12,0,0,1-17,17l-48-48a12,12,0,0,1,0-17l48-48a12,12,0,1,1,17,17L61,76H168A68.08,68.08,0,0,1,236,144Z'></path></svg>
                </div>
                <div tabindex='0' id="redoButton" ls-tooltip='Redo' class="disabled nav-menu-item">

                <!-- Window Control Buttons -->

                <div class="window-controls-wrapper">
                    <div class="window-controls">
                        <button tabindex='0' id="minimizeButton" ls-tooltip='Minimize' class="clear square">

                        </button>

                        <button tabindex='0' id="maximizeButton" ls-tooltip='Maximize' class="clear square" style="font-size: 10px">
                            <i class="bi-square"></i>
                        </button>

                        <button tabindex='0' id="closeButton" ls-tooltip='Close' class="clear square">
                            <i class="bi-x-lg"></i>
                        </button>
                    </div>
                </div>
            </div>

        </nav>

        <!-- Layout Container (the main layout will go here.) -->
        <div id="layout-container"></div>

        <!-- Editor Footer -->
        <footer id="editor-footer"></footer>
