    <title>Editor</title>

    <!-- Important immediate styles (to avoid flicker & render loading as soon as possible) -->
    <style>
        :root, body {
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: var(--surface-n2) !important;
            user-select: none;
        }

        #logo {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(calc(-50% + 92px), calc(-50% + 10px));
            offset-path: path('M8.24713 23.3995C8.24713 23.3995 42.001 -13.0019 104.001 40.9985C166.001 94.9989 238 404 238 404');
            offset-distance: 0%;
            offset-rotate: 0deg;
            /* Above everything */
            z-index: 90000000005;
            pointer-events: none;
        }

        #app-loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5rem;
            color: var(--ls-text-secondary);
        }

        .loader {
            width: 50px;
            aspect-ratio: 1;
            border-radius: 50%;
            border: 8px solid;
            border-color: currentColor #0000;
            animation: l1 1s infinite;
        }

        @keyframes l1 { to { transform: rotate(.5turn) } }
    </style>

<body ls ls-theme="dark" ls-accent="white" ls-style="flat" style="--font:Ubuntu Mono, monospace" class="level-0">
    <!-- Splash logo -->
    <img id="logo" width='200px' src='assets/images/icon.svg' alt='Editor Icon'>

    <!-- Loading indicator -->
    <div id="app-loading">
        <div style='margin-top: 150px;' class="loader"></div>
    </div>

    <main id="editor-container" style='display: none'>
        <!-- Editor Header -->
        <nav id="editor-header" class="level-2">

            <!-- Navigation Items -->
            <div>
                <img style='padding: 4px;max-width: 32px;margin-right: 4px;' class="nav-menu-item flavor-icon" draggable="false" src='assets/images/icon-flat.svg' alt='Editor Icon'>
                <div tabindex='0' class="nav-menu-item" data-ls-i18n="nav.file" data-ls-i18n-fallback="File">File</div>
                <div tabindex='0' class="nav-menu-item" data-ls-i18n="nav.options" data-ls-i18n-fallback="Options">Options</div>
                <div tabindex='0' class="nav-menu-item" data-ls-i18n="nav.layout" data-ls-i18n-fallback="Layout">Layout</div>
                <div tabindex='0' class="nav-menu-item" data-ls-i18n="nav.help" data-ls-i18n-fallback="Help">Help</div>
            </div>

            <!-- Undo/Redo Buttons -->
            <div>
                <div tabindex='0' id="undoButton" ls-tooltip='Undo' class="disabled nav-menu-item">
                    <svg xmlns='http://www.w3.org/2000/svg' width='1em' height='1em' fill='currentColor' viewBox='0 0 256 256'><path d='M236,144a68.07,68.07,0,0,1-68,68H80a12,12,0,0,1,0-24h88a44,44,0,0,0,0-88H61l27.52,27.51a12,12,0,0,1-17,17l-48-48a12,12,0,0,1,0-17l48-48a12,12,0,1,1,17,17L61,76H168A68.08,68.08,0,0,1,236,144Z'></path></svg>
                </div>
                <div tabindex='0' id="redoButton" ls-tooltip='Redo' class="disabled nav-menu-item">
                    <svg xmlns='http://www.w3.org/2000/svg' width='1em' height='1em' fill='currentColor' viewBox='0 0 256 256'><path d='M167.51,127.51,195,100H88a44,44,0,0,0,0,88h88a12,12,0,0,1,0,24H88A68,68,0,0,1,88,76H195L167.51,48.49a12,12,0,1,1,17-17l48,48a12,12,0,0,1,0,17l-48,48a12,12,0,0,1-17-17Z'></path></svg>
                </div>
            </div>

        </nav>

        <!-- Layout Container (the main layout will go here.) -->
        <div id="layout-container"></div>

        <!-- Editor Footer -->
        <footer id="editor-footer"></footer>

        <!-- Preferences Modal -->
        <div id="preferences-modal" style='display: none'>
            <button class="menu-button clear square"><i class="bi-list"></i></button>
            <div class="menu sidebar-items level-n1">
                <div class="grouped-buttons">
                    <button data-tab-id='main' class="elevated"><i class="bi-house-fill"></i><span>Main</span></button>
                </div>
                <span class="menu-category-title">Navigation</span>
                <div class="grouped-buttons">
                    <button data-tab-id='keyboard-shortcuts' class="elevated"><i class="bi-keyboard-fill"></i><span>Keyboard Shortcuts</span></button>
                </div>
            </div>
            <div class="sidebar-content"></div>
        </div>
    </main>
